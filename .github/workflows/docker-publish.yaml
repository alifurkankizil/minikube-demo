name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    # Kendi yaptığımız k8s değişikliği tekrar build tetiklemesin diye k8s klasörünü hariç tutuyoruz
    paths-ignore:
      - 'k8s/**'
      - 'README.md'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Kodu geri pushlamak için yazma izni gerekli

    steps:
      # 1. Kodu Çek
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Commit Hash'i (SHA) al ve değişkene ata
      - name: Get Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      # 3. Docker Hub'a Giriş Yap
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # 4. Build ve Push (Etikete dikkat: :latest yerine commit hash kullanıyoruz)
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # BURAYI KENDİ KULLANICI ADINLA GÜNCELLE:
          tags: alifurkankizil/my-dotnet-app:${{ steps.vars.outputs.sha_short }}
      
      # 5. Kubernetes Manifestosunu Güncelle
      - name: Update Kubernetes Manifest
        run: |
          # Deployment dosyasındaki image: satırını bul ve yeni tag ile değiştir
          # sed komutu Linux'ta metin değiştirmek için kullanılır
          sed -i "s|image: .*|image: dockerhubkullaniciadin/my-dotnet-app:${{ steps.vars.outputs.sha_short }}|g" k8s/deployment.yaml
          
          # Değişikliği ekrana bas (kontrol için)
          cat k8s/deployment.yaml
      
      # 6. Değişikliği Git'e Kaydet (Commit & Push)
      - name: Commit and Push Manifest Change
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git add k8s/deployment.yaml
          git commit -m "Update image tag to ${{ steps.vars.outputs.sha_short }} [skip ci]"
          git push