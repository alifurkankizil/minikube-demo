name: Build and Push Docker Image

# Bu akış ne zaman çalışsın?
on:
  push:
    branches: [ "main" ] # main dalına kod gelince çalışır
    # Sadece kod değiştiğinde çalışsın, k8s dosyaları değişince çalışmasın istersen:
    paths-ignore:
      - 'k8s/**'
      - 'README.md'

jobs:
  build-and-push:
    runs-on: ubuntu-latest # GitHub'ın sağladığı sanal Ubuntu makinesi

    steps:
      # 1. Adım: GitHub'daki kodunu sanal makineye çek
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Adım: Docker Hub'a güvenli giriş yap
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # 3. Adım: Docker imajını oluştur ve Docker Hub'a gönder
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # DİKKAT: Aşağıdaki kısmı kendi kullanıcı adınla güncelle!
          tags: alifurkankizil/my-dotnet-app:latest